services:
  # 開発環境のみで利用（本番はCloud Pub/Sub）

  web:
    build:
      context: ./rails-server
      dockerfile: Dockerfile
      args:
        BUNDLE_PATH_ARG: vendor/bundle
    container_name: myapp-web
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b '0.0.0.0'"
    volumes:
      - ./rails-server:/rails
      - bundle_data:/rails/vendor/bundle
    ports:
      - "3000:3000"
    environment:
      BUNDLE_PATH: vendor/bundle
      BUNDLE_DEPLOYMENT: "0"
      RAILS_ENV: development
      # Firestore configuration
      GOOGLE_CLOUD_PROJECT_ID: bandbrother2-dev
      GOOGLE_APPLICATION_CREDENTIALS: /rails/config/service-account-key.json
      # Pub/Sub configuration
      PUBSUB_EMULATOR_HOST: ""  # Mock mode
      MATCHING_QUEUE_TOPIC: bandbrother2-matching-queue
      MATCH_RESULTS_TOPIC: bandbrother2-match-results
      ROOM_EVENTS_TOPIC: bandbrother2-room-events
      # 開発環境フラグ
      USE_PUBSUB_MOCK: "true"
      USE_FIRESTORE_EMULATOR: "false"
      DISABLE_EXTERNAL_SERVICES: "false"
    restart: unless-stopped

  game-server:
    build:
      context: ./game-server
      dockerfile: Dockerfile
    container_name: myapp-game-server
    ports:
      - "8080:8080"
    environment:
      WS_PORT: "8080"
      RAILS_API_URL: http://web:3000
      # Firestore configuration
      GOOGLE_CLOUD_PROJECT_ID: bandbrother2-dev
      GOOGLE_APPLICATION_CREDENTIALS: /app/config/service-account-key.json
      # Pub/Sub configuration
      PUBSUB_EMULATOR_HOST: ""  # Mock mode
      MATCH_RESULTS_SUBSCRIPTION: match-results-subscription
      ROOM_EVENTS_TOPIC: bandbrother2-room-events
      # 開発環境フラグ
      USE_PUBSUB_MOCK: "true"
      USE_FIRESTORE_EMULATOR: "false"
      DISABLE_EXTERNAL_SERVICES: "false"
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped
volumes:
  bundle_data:
